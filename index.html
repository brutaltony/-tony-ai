<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Tony AI — Intelligence, Refined</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
  --bg: #05030d;
  --panel: #100b20;
  --silver: #f5f0ff;
  --muted: #a49bbd;
  --line: rgba(167, 113, 255, .25);
  --purple: #a855f7;
  --blue: #38bdf8;
}

    body {
      min-height: 100vh;
      background:
radial-gradient(ellipse at 15% 15%, rgba(168, 85, 247, .25), transparent 40%),
radial-gradient(ellipse at 85% 35%, rgba(56, 189, 248, .20), transparent 40%),
radial-gradient(ellipse at 50% 100%, rgba(99, 102, 241, .16), transparent 45%),
#05030d;
}
    .app {
      width: 100%;
      max-width: 760px;
      min-height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      background: rgba(12,12,12,.94);
      border: 1px solid var(--line);
      border-radius: 25px;
      overflow: hidden;
      box-shadow:
0 0 25px rgba(168, 85, 247, .15),
0 0 60px rgba(56, 189, 248, .08),
0 20px 80px rgba(0, 0, 0, .65);
      position: relative;
      isolation: isolate;
animation: neonPulse 4s ease-in-out infinite alternate;
    }

    header {
      padding: 23px 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.015);
    }

    .logo {
      width: 47px;
      height: 47px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg, #e9d5ff, #a855f7 45%, #38bdf8);
      color: #080808;
      font-size: 23px;
      font-weight: 900;
      box-shadow:
0 0 15px rgba(168, 85, 247, .65),
0 0 35px rgba(56, 189, 248, .35);
    }

    .brand {
      flex: 1;
    }

    .brand h1 {
      font-size: 20px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #ffffff;
text-shadow: 0 0 10px #a855f7, 0 0 22px #38bdf8;
    }

    .brand p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status {
      font-size: 11px;
      color: #c9c9c9;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a8a8a8;
      box-shadow: 0 0 9px #aaa;
    }

    #chat {
      flex: 1;
      padding: 24px 17px;
      display: flex;
      flex-direction: column;
      gap: 17px;
      overflow-y: auto;
      min-height: 300px;
      max-height: calc(100vh - 230px);
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto 0;
      text-align: center;
      padding: 40px 12px;
      animation: appear .7s ease;
    }

    .welcome-icon {
      font-size: 43px;
      margin-bottom: 20px;
      filter: grayscale(1);
    }

    .welcome h2 {
      font-size: clamp(26px, 6vw, 37px);
      letter-spacing: -1px;
      margin-bottom: 12px;
      background: linear-gradient(100deg, #777, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      max-width: 360px;
      margin: auto;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .msg {
      max-width: 88%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: appear .25s ease;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #f0f0f0, #bdbdbd);
      color: #111;
      border-bottom-right-radius: 5px;
    }

    .bot {
      align-self: flex-start;
      background: linear-gradient(145deg, #1c1c1c, #121212);
      border: 1px solid rgba(255,255,255,.1);
      color: #ededed;
      border-bottom-left-radius: 5px;
    }

    .error {
      color: #ffaaaa;
      border-color: rgba(255,100,100,.3);
    }

    .composer-area {
      padding: 15px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.015);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 7px;
      background: #171717;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      align-items: center;
      transition: border-color .2s, box-shadow .2s;
    }

    form:focus-within {
      border-color: rgba(255,255,255,.4);
      box-shadow: 0 0 22px rgba(255,255,255,.04);
    }

    #message {
      flex: 1;
      min-width: 0;
      padding: 12px 9px;
      color: white;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
    }

    #message::placeholder {
      color: #777;
    }

    #send {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #c084fc, #8b5cf6 45%, #38bdf8);
      color: #111;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
      box-shadow: 0 0 18px rgba(168, 85, 247, .45);
    }

    #send:active {
      transform: scale(.93);
    }

    #send:disabled {
      opacity: .45;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 10px;
      letter-spacing: .7px;
      padding-top: 13px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .app {
        min-height: 100vh;
        border-radius: 0;
        border: none;
      }

      header {
        padding: 19px 15px;
      }

      #chat {
        max-height: none;
        padding: 22px 14px;
      }

      .msg {
        max-width: 92%;
      }

      .composer-area {
        padding-bottom: max(15px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo">T</div>
      <div class="brand">
        <h1>TONY AI</h1>
        <p>Intelligence, refined</p>
      </div>
      <div class="status">
        <span class="dot"></span>
        Ready
      </div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✧</div>
        <h2>Welcome to Tony AI</h2>
        <p>A smarter space for ideas, questions and possibilities. What shall we explore today?</p>
      </div>
    </section>

    <div class="composer-area">
      <form id="form">
        <input
          id="message"
          type="text"
          placeholder="Ask Tony anything..."
          autocomplete="off"
          aria-label="Your message"
          required
        >
        <button id="send" type="submit" aria-label="Send message">↑</button>
      </form>
      <div class="footer">TONY AI · BUILT FOR WHAT'S NEXT</div>
    </div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const button = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    // Conversation memory while this page remains open.
    let previousInteractionId = null;

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = "msg " + role;
      element.textContent = text;
      chat.appendChild(element);
      scrollToBottom();
      return element;
    }

    function showError(element, message) {
      element.classList.add("error");
      element.textContent = message;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || button.disabled) return;

      if (welcome && welcome.isConnected) welcome.remove();

      addMessage(text, "user");

      input.value = "";
      input.disabled = true;
      button.disabled = true;
      button.textContent = "…";

      const bot = addMessage("Tony is thinking...", "bot");

      let receivedText = "";
      let streamFailed = false;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            previousInteractionId: previousInteractionId
          })
        });

        if (!response.ok) {
          const raw = await response.text();
          let errorMessage = "Tony couldn't connect. Please try again.";

          try {
            const data = JSON.parse(raw);
            errorMessage =
              data.details?.error?.message ||
              data.details ||
              data.error ||
              errorMessage;

            if (typeof errorMessage !== "string") {
              errorMessage = JSON.stringify(errorMessage);
            }
          } catch {}

          showError(bot, errorMessage);
          streamFailed = true;
          return;
        }

        if (!response.body) {
          showError(bot, "No response stream received.");
          streamFailed = true;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        function processEvent(block) {
          const lines = block.split(/\r?\n/);
          const dataLines = lines
            .filter(line => line.startsWith("data:"))
            .map(line => line.slice(5).trimStart());

          if (dataLines.length === 0) return;

          const raw = dataLines.join("\n").trim();
          if (!raw || raw === "[DONE]") return;

          let data;

          try {
            data = JSON.parse(raw);
          } catch {
            return;
          }

          const type = data.event_type || data.type;

          if (
            type === "interaction.completed" &&
            data.interaction?.id
          ) {
            previousInteractionId = data.interaction.id;
          }

          if (
            type === "step.delta" &&
            data.delta?.type === "text"
          ) {
            if (!receivedText) bot.textContent = "";
            receivedText += data.delta.text || "";
            bot.textContent = receivedText;
            scrollToBottom();
          }

          if (type === "error") {
            showError(
              bot,
              data.error?.message || "Gemini encountered an error."
            );
            streamFailed = true;
          }
        }

        while (true) {
          const result = await reader.read();
          if (result.done) break;

          buffer += decoder.decode(result.value, { stream: true });

          const blocks = buffer.split(/\r?\n\r?\n/);
          buffer = blocks.pop() || "";

          for (const block of blocks) {
            processEvent(block);
          }
        }

        buffer += decoder.decode();

        if (buffer.trim()) {
          processEvent(buffer);
        }

        if (!receivedText && !streamFailed) {
          showError(bot, "Tony returned no text. Please try again.");
        }

      } catch (error) {
        console.error("Tony AI error:", error);
        showError(bot, "Connection interrupted. Please try again.");
      } finally {
        input.disabled = false;
        button.disabled = false;
        button.textContent = "↑";
        input.focus();
        scrollToBottom();
      }
    });
  </script>
</body>
</html>
