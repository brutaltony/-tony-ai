<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>Tony AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080b14;color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:22px;text-align:center;
  border-bottom:1px solid #242a40;
}
header h1{margin:0;color:#7c83ff}
header p{color:#9299ad;font-size:13px}
#chat{
  padding:18px;height:65vh;overflow-y:auto;
}
.msg{
  padding:13px;margin:12px 0;
  border-radius:14px;max-width:85%;
  line-height:1.5;overflow-wrap:anywhere;
}
.bot{background:#171d30}
.user{background:#4545b5;margin-left:auto}
form{
  position:fixed;bottom:0;left:0;width:100%;
  display:flex;gap:8px;padding:14px;
  background:#080b14;border-top:1px solid #242a40;
}
input{
  flex:1;min-width:0;padding:14px;
  border:1px solid #343b55;border-radius:12px;
  background:#171d30;color:white;font-size:16px;
}
button{
  padding:12px 16px;border:0;border-radius:12px;
  background:#747bff;color:white;font-weight:bold;
}
</style>
</head>

<body>
<header>
  <h1>⚡ TONY AI</h1>
  <p>Your AI. Your World.</p>
</header>

<div id="chat">
  <div class="msg bot">
    Welcome to Tony AI! 👋<br>
    I'm your personal assistant.
    What shall we explore today?
  </div>
</div>

<form id="form">
  <input id="message"
    placeholder="Message Tony AI..."
    autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const button = form.querySelector("button");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  const user = document.createElement("div");
  user.className = "msg user";
  user.textContent = text;
  chat.appendChild(user);

  input.value = "";
  input.disabled = true;
  button.disabled = true;

  const bot = document.createElement("div");
  bot.className = "msg bot";
  bot.textContent = "Tony is thinking... 🤖";
  chat.appendChild(bot);

  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    bot.textContent = data.reply || "No reply received.";
  } catch (error) {
    console.error("Tony AI error:", error);
    bot.textContent = "Sorry, Tony couldn't connect. Please try again.";
  } finally {
    input.disabled = false;
    button.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
});
</script>

</body>
</html>
