<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070611">
<title>Tony AI | Beyond Intelligence</title>

<style>
:root {
  --bg: #070611;
  --purple: #a855f7;
  --blue: #38bdf8;
  --white: #ffffff;
  --muted: #aaa4c2;
  --border: rgba(168,85,247,.25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  color: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 10% 10%, rgba(168,85,247,.22), transparent 38%),
    radial-gradient(ellipse at 90% 25%, rgba(56,189,248,.17), transparent 38%),
    radial-gradient(ellipse at 50% 100%, rgba(99,102,241,.13), transparent 45%),
    var(--bg);
  display: flex;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(255,255,255,.012) 4px
  );
  z-index: -1;
}

.app {
  width: 100%;
  max-width: 780px;
  min-height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border: 1px solid rgba(168,85,247,.35);
  border-radius: 28px;
  background: rgba(10,8,22,.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow:
    0 0 25px rgba(168,85,247,.15),
    0 0 70px rgba(56,189,248,.07),
    0 25px 100px rgba(0,0,0,.65);
  animation: panelGlow 5s ease-in-out infinite alternate;
}

@keyframes panelGlow {
  from {
    border-color: rgba(168,85,247,.25);
    box-shadow: 0 0 25px rgba(168,85,247,.12);
  }
  to {
    border-color: rgba(56,189,248,.5);
    box-shadow:
      0 0 35px rgba(168,85,247,.22),
      0 0 75px rgba(56,189,248,.12);
  }
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 23px;
  border-bottom: 1px solid rgba(255,255,255,.09);
  background: linear-gradient(
    110deg,
    rgba(168,85,247,.09),
    rgba(56,189,248,.04)
  );
}

.logo {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 17px;
  color: #fff;
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #d8b4fe, #9333ea 48%, #38bdf8);
  border: 1px solid rgba(255,255,255,.45);
  box-shadow:
    0 0 16px rgba(168,85,247,.7),
    0 0 35px rgba(56,189,248,.3);
  animation: logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoGlow {
  from { box-shadow: 0 0 12px rgba(168,85,247,.45); }
  to {
    box-shadow:
      0 0 22px rgba(168,85,247,.8),
      0 0 42px rgba(56,189,248,.35);
  }
}

.brand {
  flex: 1;
  min-width: 0;
}

.brand h1 {
  display: inline-block;
  color: #fff !important;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 3px;
  line-height: 1.4;
  text-shadow:
    0 0 8px rgba(255,255,255,.8),
    0 0 18px rgba(168,85,247,.9),
    0 0 35px rgba(56,189,248,.6);
}

.brand p {
  color: #c4b5fd;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 5px;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #c4b5fd;
  font-size: 11px;
  white-space: nowrap;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 12px #4ade80;
  animation: statusPulse 2s infinite;
}

@keyframes statusPulse {
  50% { opacity: .45; }
}

#chat {
  flex: 1;
  min-height: 320px;
  max-height: calc(100vh - 245px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 25px 20px;
  scroll-behavior: smooth;
}

.welcome {
  margin: auto 0;
  text-align: center;
  padding: 40px 10px;
  animation: riseIn .8s ease;
}

.orb {
  width: 100px;
  height: 100px;
  margin: 0 auto 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 43px;
  color: white;
  background:
    radial-gradient(circle at 35% 25%, #e9d5ff, #a855f7 40%, #312e81 75%);
  border: 1px solid rgba(255,255,255,.4);
  box-shadow:
    0 0 25px rgba(168,85,247,.55),
    0 0 65px rgba(56,189,248,.2),
    inset 0 0 20px rgba(255,255,255,.2);
  animation: floatOrb 4s ease-in-out infinite;
}

@keyframes floatOrb {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-8px) rotate(4deg); }
}

.welcome h2 {
  font-size: clamp(27px, 6vw, 43px);
  font-weight: 850;
  letter-spacing: -1px;
  color: #fff;
  text-shadow:
    0 0 12px rgba(168,85,247,.7),
    0 0 28px rgba(56,189,248,.25);
  margin-bottom: 14px;
}

.welcome p {
  max-width: 380px;
  margin: auto;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.msg {
  max-width: 88%;
  padding: 14px 17px;
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  border-radius: 19px;
  animation: riseIn .25s ease;
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  align-self: flex-end;
  color: #fff;
  background: linear-gradient(135deg, #9333ea, #6d28d9 60%, #4338ca);
  border: 1px solid rgba(216,180,254,.5);
  border-bottom-right-radius: 5px;
  box-shadow: 0 0 18px rgba(168,85,247,.2);
}

.bot {
  align-self: flex-start;
  color: #f5f3ff;
  background: linear-gradient(135deg, rgba(168,85,247,.11), rgba(56,189,248,.06));
  border: 1px solid rgba(168,85,247,.23);
  border-bottom-left-radius: 5px;
}

.error {
  color: #fca5a5;
  border-color: rgba(248,113,113,.4);
}

.composer-area {
  padding: 17px;
  border-top: 1px solid rgba(255,255,255,.09);
  background: rgba(7,6,17,.85);
}

form {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px;
  border-radius: 19px;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(168,85,247,.3);
  box-shadow: inset 0 0 20px rgba(168,85,247,.035);
  transition: border-color .25s, box-shadow .25s;
}

form:focus-within {
  border-color: rgba(56,189,248,.8);
  box-shadow:
    0 0 15px rgba(168,85,247,.2),
    0 0 25px rgba(56,189,248,.1);
}

#message {
  flex: 1;
  min-width: 0;
  padding: 13px 10px;
  border: none;
  outline: none;
  background: transparent;
  color: #fff;
  font-size: 15px;
}

#message::placeholder {
  color: #8f86a8;
}

#send {
  width: 47px;
  height: 47px;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 15px;
  background: linear-gradient(135deg, #c084fc, #9333ea 48%, #38bdf8);
  color: white;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(168,85,247,.5);
  transition: transform .2s, box-shadow .2s;
}

#send:active {
  transform: scale(.92);
  box-shadow: 0 0 30px rgba(56,189,248,.6);
}

#send:disabled {
  opacity: .5;
  cursor: wait;
}

.footer {
  padding-top: 13px;
  text-align: center;
  color: #827899;
  font-size: 9px;
  letter-spacing: 1.4px;
}

@media (max-width: 480px) {
  body { padding: 0; }

  .app {
    min-height: 100vh;
    border-radius: 0;
    border-left: none;
    border-right: none;
  }

  header { padding: 19px 15px; }

  .brand h1 {
    font-size: 19px;
    letter-spacing: 2px;
  }

  .brand p {
    font-size: 9px;
    letter-spacing: 1.2px;
  }

  #chat {
    max-height: none;
    padding: 22px 14px;
  }

  .msg { max-width: 92%; }

  .composer-area {
    padding-bottom: max(15px, env(safe-area-inset-bottom));
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header>
    <div class="logo">T</div>

    <div class="brand">
      <h1>TONY AI</h1>
      <p>Beyond Intelligence</p>
    </div>

    <div class="status">
      <span class="dot"></span>
      Online
    </div>
  </header>

  <section id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h2>Meet Your Intelligence.</h2>
      <p>
        A new dimension of thinking.
        Ask questions, explore ideas, and bring your imagination to life.
      </p>
    </div>
  </section>

  <div class="composer-area">
    <form id="form">
      <input
        id="message"
        type="text"
        placeholder="Message Tony AI..."
        autocomplete="off"
        aria-label="Your message"
        required
      >
      <button id="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <div class="footer">TONY AI · POWERED BY CURIOSITY</div>
  </div>

</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const button = document.getElementById("send");
const welcome = document.getElementById("welcome");

// Keeps conversation context while this page remains open.
let previousInteractionId = null;

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(text, role) {
  const element = document.createElement("div");
  element.className = "msg " + role;
  element.textContent = text;
  chat.appendChild(element);
  scrollToBottom();
  return element;
}

function showError(element, message) {
  element.classList.add("error");
  element.textContent = message;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const text = input.value.trim();
  if (!text || button.disabled) return;

  if (welcome && welcome.isConnected) welcome.remove();

  addMessage(text, "user");

  input.value = "";
  input.disabled = true;
  button.disabled = true;
  button.textContent = "…";

  const bot = addMessage("Tony is thinking...", "bot");

  let receivedText = "";
  let typingBuffer = "";
let typingQueue = [];
let displayedText = "";
let typingActive = false;
let displayedLength = 0;
let typingTimer = null;
  let streamFailed = false;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        previousInteractionId: previousInteractionId
      })
    });

    if (!response.ok) {
      const raw = await response.text();
      let errorMessage = "Tony couldn't connect. Please try again.";

      try {
        const data = JSON.parse(raw);
        errorMessage =
          data.details?.error?.message ||
          data.details ||
          data.error ||
          errorMessage;

        if (typeof errorMessage !== "string") {
          errorMessage = JSON.stringify(errorMessage);
        }
      } catch {}

      showError(bot, errorMessage);
      streamFailed = true;
      return;
    }

    if (!response.body) {
      showError(bot, "No response stream received.");
      streamFailed = true;
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    function processEvent(block) {
      const lines = block.split(/\r?\n/);
      const dataLines = lines
        .filter(line => line.startsWith("data:"))
        .map(line => line.slice(5).trimStart());

      if (!dataLines.length) return;

      const raw = dataLines.join("\n").trim();
      if (!raw || raw === "[DONE]") return;

      let data;

      try {
        data = JSON.parse(raw);
      } catch {
        return;
      }

      const type = data.event_type || data.type;

      if (
        type === "interaction.completed" &&
        data.interaction?.id
      ) {
        previousInteractionId = data.interaction.id;
      }

      if (
        type === "step.delta" &&
        data.delta?.type === "text"
      ) {
        if (!receivedText) bot.textContent = "";
        receivedText += data.delta.text || "";
        bot.textContent = receivedText;
bot.classList.add("typing");
        scrollToBottom();
      }

      if (type === "error") {
        showError(
          bot,
          data.error?.message || "Gemini encountered an error."
        );
        streamFailed = true;
      }
    }

    while (true) {
      const result = await reader.read();
      if (result.done) break;

      buffer += decoder.decode(result.value, { stream: true });

      const blocks = buffer.split(/\r?\n\r?\n/);
      buffer = blocks.pop() || "";

      for (const block of blocks) {
        processEvent(block);
      }
    }

    buffer += decoder.decode();

    if (buffer.trim()) {
      processEvent(buffer);
    }

    if (!receivedText && !streamFailed) {
      showError(bot, "Tony returned no text. Please try again.");
    }

  } catch (error) {
    console.error("Tony AI error:", error);
    showError(bot, "Connection interrupted. Please try again.");
  } finally {
    input.disabled = false;
    button.disabled = false;
    bot.classList.remove("typing");
    button.textContent = "↑";
    input.focus();
    scrollToBottom();
  }
});
</script>
</body>
</html>
